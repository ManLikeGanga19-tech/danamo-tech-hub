services:
  db:
    image: postgres:16
    container_name: danamo-postgres
    environment:
      POSTGRES_USER: danamo
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: danamo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danamo"]
      interval: 5s
      retries: 5
volumes:
  pgdata:
