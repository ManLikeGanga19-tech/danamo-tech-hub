name: Build and publish images

# Builds the backend and frontend images and publishes them to GHCR:
#   ghcr.io/manlikeganga19-tech/danamo-backend
#   ghcr.io/manlikeganga19-tech/danamo-frontend
#
# Tags:
#   push to main  -> :main, :latest, :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :sha-<short>
#   pull request  -> build only, nothing pushed
#
# Deploy a specific build on the VPS by setting IMAGE_TAG=sha-<short> in
# /opt/danamo/.env (pinned, easy rollback) or IMAGE_TAG=latest.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/manlikeganga19-tech/danamo

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=danamo-${{ matrix.image }}
            org.opencontainers.image.description=Danamo Tech Hub ${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend build-time settings (ignored by the backend Dockerfile)
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.danamotech.co.ke/api/v1
            BACKEND_INTERNAL_URL=http://backend:8000
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID || 'G-XSZM34HJX5' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
